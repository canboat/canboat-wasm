[package]
name        = "canboat-wasm"
version     = "0.1.0"
edition     = "2024"
license     = "Apache-2.0"
authors     = ["Kees Verruijt <canboat@verruijt.net>"]
repository  = "https://github.com/canboat/canboat-wasm"
description = "WebAssembly bindings for the canboat NMEA 2000 decoder/encoder."

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
# The wire brain comes from the canboat repo itself — one codebase,
# compiled here for wasm32, pinned to an upstream revision. Bump the
# rev consciously: it changes the compiled brain.
# TEMPORARY staging pin: canboat master + canboat#815 (SI+camel
# defaults) + canboat#816 (absent count encodes zero) from the fork's
# wasm-brain-stack, for field testing ahead of the merges. Repoint to
# canboat/canboat as soon as both land.
canboat-core = { git = "https://github.com/dirkwa/canboat-fork", rev = "e72dc9d14561be0eec80bdca420da823fb3bdcdc" }
canboat      = { git = "https://github.com/dirkwa/canboat-fork", rev = "e72dc9d14561be0eec80bdca420da823fb3bdcdc", default-features = false, features = ["json-input"] }
canboat-io   = { git = "https://github.com/dirkwa/canboat-fork", rev = "e72dc9d14561be0eec80bdca420da823fb3bdcdc" }
wasm-bindgen = "0.2"

[profile.release]
opt-level = "z"
lto       = true
strip     = true

# Recent rustc emits bulk-memory / nontrapping-fptoint by default; the
# wasm-opt bundled with wasm-pack rejects them unless told.
[package.metadata.wasm-pack.profile.release]
wasm-opt = ["-O", "--enable-bulk-memory", "--enable-nontrapping-float-to-int"]

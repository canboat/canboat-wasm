[package]
name        = "canboat-wasm"
version     = "0.1.0"
edition     = "2024"
license     = "Apache-2.0"
authors     = ["Kees Verruijt <canboat@verruijt.net>"]
repository  = "https://github.com/canboat/canboat-wasm"
description = "WebAssembly bindings for the canboat NMEA 2000 decoder/encoder."

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
# The wire brain comes from the canboat repo itself — one codebase,
# compiled here for wasm32, pinned to an upstream revision. Bump the
# rev consciously: it changes the compiled brain.
canboat-core = { git = "https://github.com/canboat/canboat", rev = "1d7450c5a3314ac6654998529138bed8f6c3678c" }
canboat      = { git = "https://github.com/canboat/canboat", rev = "1d7450c5a3314ac6654998529138bed8f6c3678c", default-features = false, features = ["json-input"] }
wasm-bindgen = "0.2"

[profile.release]
opt-level = "z"
lto       = true
strip     = true

# Recent rustc emits bulk-memory / nontrapping-fptoint by default; the
# wasm-opt bundled with wasm-pack rejects them unless told.
[package.metadata.wasm-pack.profile.release]
wasm-opt = ["-O", "--enable-bulk-memory", "--enable-nontrapping-float-to-int"]

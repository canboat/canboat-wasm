[package]
name        = "canboat-wasm"
version     = "8.2.1" # x-release-please-version
edition     = "2024"
license     = "Apache-2.0"
authors     = ["Kees Verruijt <canboat@verruijt.net>"]
repository  = "https://github.com/canboat/canboat-wasm"
description = "WebAssembly bindings for the canboat NMEA 2000 decoder/encoder."

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
# The wire brain comes from the canboat repo itself — one codebase,
# compiled here for wasm32. Normally pinned to a canboat release tag and
# moved by the track-canboat workflow.
#
# TEMPORARY: a path dependency on a sibling canboat checkout, for porting
# onto the single `canboat` crate's facade (canboat#921, canboat#925) before
# that is released. CI cannot build this; switch back to a release pin
# (`version = "8.x"` from crates.io) before merging.
canboat      = { path = "../canboat/crates/canboat", default-features = false, features = ["decode", "json-input"] }
# Already in the tree via canboat's json-input; used to fold flat
# canboatjs records into `fields` before encoding.
serde_json   = "1"
wasm-bindgen = "0.2"

[profile.release]
opt-level = "z"
lto       = true
strip     = true

# Recent rustc emits bulk-memory / nontrapping-fptoint by default; the
# wasm-opt bundled with wasm-pack rejects them unless told.
[package.metadata.wasm-pack.profile.release]
wasm-opt = ["-O", "--enable-bulk-memory", "--enable-nontrapping-float-to-int"]


[package]
name        = "canboat-wasm"
version     = "8.0.0-beta3" # x-release-please-version
edition     = "2024"
license     = "Apache-2.0"
authors     = ["Kees Verruijt <canboat@verruijt.net>"]
repository  = "https://github.com/canboat/canboat-wasm"
description = "WebAssembly bindings for the canboat NMEA 2000 decoder/encoder."

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
# The wire brain comes from the canboat repo itself — one codebase,
# compiled here for wasm32, pinned to an upstream revision. Bumping the
# pin changes the compiled brain: it happens via the track-canboat
# workflow, which follows canboat releases and moves the pin to the
# release tag (current pin: master at the canboat#820 merge — the
# J1939 schema flavor; ahead of the newest release by design, the
# tracker's never-downgrade guard skips until a newer release exists).
canboat-core = { git = "https://github.com/canboat/canboat", tag = "v8.0.0" }
canboat      = { git = "https://github.com/canboat/canboat", tag = "v8.0.0", default-features = false, features = ["json-input"] }
canboat-io   = { git = "https://github.com/canboat/canboat", tag = "v8.0.0" }
wasm-bindgen = "0.2"

[profile.release]
opt-level = "z"
lto       = true
strip     = true

# Recent rustc emits bulk-memory / nontrapping-fptoint by default; the
# wasm-opt bundled with wasm-pack rejects them unless told.
[package.metadata.wasm-pack.profile.release]
wasm-opt = ["-O", "--enable-bulk-memory", "--enable-nontrapping-float-to-int"]


[package]
name        = "canboat-wasm"
version     = "8.5.0" # x-release-please-version
edition     = "2024"
license     = "Apache-2.0"
authors     = ["Kees Verruijt <canboat@verruijt.net>"]
repository  = "https://github.com/canboat/canboat-wasm"
description = "WebAssembly bindings for the canboat NMEA 2000 decoder/encoder."

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
# The wire brain comes from canboat itself — one codebase, compiled here
# for wasm32 — as the `canboat` crate on crates.io, with only its sans-I/O
# features. Pinned exactly: the npm version names the canboat release it
# compiles. Bumping the pin changes the compiled brain; it happens via the
# track-canboat workflow, which follows canboat releases.
canboat      = { version = "=8.3.0", default-features = false, features = ["decode", "json-input"] }
# Already in the tree via canboat's json-input; used to fold flat
# canboatjs records into `fields` before encoding.
serde_json   = "1"
wasm-bindgen = "0.2"

[profile.release]
opt-level = "z"
lto       = true
strip     = true

# Recent rustc emits bulk-memory / nontrapping-fptoint by default; the
# wasm-opt bundled with wasm-pack rejects them unless told.
[package.metadata.wasm-pack.profile.release]
wasm-opt = ["-O", "--enable-bulk-memory", "--enable-nontrapping-float-to-int"]

# BEGIN carried canboat fix
# canboat/canboat#1074, not yet in a canboat release: a 126208
# parameter list for 126720 is matched against the manufacturer variants
# behind its catch-all, as the C analyzer does, so an Airmar DST console's
# requests and commands encode. The revision is that fix alone on top of
# canboat v8.3.0, the pin above, so nothing else from canboat's master
# comes with it. track-canboat deletes this block when it moves the pin;
# the smoke vector for the console's request then fails the tracking run
# unless the new release includes the fix too.
[patch.crates-io]
canboat = { git = "https://github.com/dirkwa/canboat-fork", rev = "e45ed412e2644b877ba6e1b5f07555aa1d1db0e6" }
# END carried canboat fix

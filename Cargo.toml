[package]
name        = "canboat-wasm"
version     = "0.1.0"
edition     = "2024"
license     = "Apache-2.0"
authors     = ["Kees Verruijt <canboat@verruijt.net>"]
repository  = "https://github.com/canboat/canboat-wasm"
description = "WebAssembly bindings for the canboat NMEA 2000 decoder/encoder."

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
# The wire brain comes from the canboat repo itself — one codebase,
# compiled here for wasm32. Pinned to the branch carrying the two
# prerequisites (wasm32 target fixes in canboat-core, the json-input
# library feature in canboat); repoint to canboat/canboat master once
# those are merged upstream.
canboat-core = { git = "https://github.com/dirkwa/canboat-fork", rev = "1b5518b93b8c48c92c4b28f2cb1663f981106c61" }
canboat      = { git = "https://github.com/dirkwa/canboat-fork", rev = "1b5518b93b8c48c92c4b28f2cb1663f981106c61", default-features = false, features = ["json-input"] }
wasm-bindgen = "0.2"

[profile.release]
opt-level = "z"
lto       = true
strip     = true

# Recent rustc emits bulk-memory / nontrapping-fptoint by default; the
# wasm-opt bundled with wasm-pack rejects them unless told.
[package.metadata.wasm-pack.profile.release]
wasm-opt = ["-O", "--enable-bulk-memory", "--enable-nontrapping-float-to-int"]

name: track-canboat

# Follows canboat releases (including alphas/betas). When canboat cuts
# vX.Y.Z, this opens a PR that moves the `canboat` crate pin to X.Y.Z, with a
# `Release-As: X.Y.Z` footer — canboat's own convention for steering
# release-please (see canboat#782/#817). Merging the PR makes
# release-please propose "chore: release X.Y.Z"; merging *that* tags,
# cuts the Release, and publish.yml ships the npm package — so the npm
# version always names the canboat brain it compiles.
#
# The full check runs here, before the PR is opened. The PR itself is
# opened with a GitHub App token (RELEASE_APP_ID / RELEASE_APP_PRIVATE_KEY)
# rather than the default GITHUB_TOKEN, which would not trigger CI on it.

# canboat's release workflow sends the `canboat-release` dispatch once the
# crate is on crates.io, so a release is tracked within minutes. The daily
# schedule is only a fallback for a missed dispatch.
on:
  schedule:
    - cron: "35 4 * * *"
  workflow_dispatch:
    inputs:
      tag:
        description: "canboat tag to track (default: latest release)"
        required: false
  repository_dispatch:
    types: [canboat-release]

permissions:
  contents: write
  pull-requests: write

jobs:
  track:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/create-github-app-token@v3
        id: app-token
        with:
          app-id: ${{ secrets.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}

      - uses: actions/checkout@v7
        with:
          token: ${{ steps.app-token.outputs.token }}

      - name: Determine target canboat release
        id: target
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="${{ github.event.inputs.tag || github.event.client_payload.tag || '' }}"
          EXPLICIT="yes"
          if [ -z "$TAG" ]; then
            EXPLICIT="no"
            # The releases list includes prereleases; the "latest"
            # endpoint would skip alphas/betas.
            TAG=$(gh api repos/canboat/canboat/releases --jq '.[0].tag_name')
          fi
          case "$TAG" in
            v[0-9]*.[0-9]*.[0-9]*) ;;
            *) echo "::error::'$TAG' is not a vX.Y.Z tag"; exit 1 ;;
          esac
          # The pin is the exact crates.io version of the `canboat` crate;
          # as a tag name it is vX.Y.Z.
          CURRENT="v$(sed -nE 's/^canboat *= *\{ *version = "=?([^"]+)".*/\1/p' Cargo.toml)"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"
          if [ "$CURRENT" = "$TAG" ]; then
            echo "Already pinned to $TAG"
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if git ls-remote --exit-code origin "refs/heads/track-canboat-$TAG" >/dev/null 2>&1; then
            echo "Tracking branch for $TAG already exists"
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # Never auto-downgrade: an auto-detected release must be newer
          # than the commit currently pinned (the pin may sit ahead of
          # the newest release, e.g. on a master rev). An explicit tag
          # from dispatch input bypasses this — deliberate rebuilds and
          # rollbacks stay possible.
          if [ "$EXPLICIT" = "no" ]; then
            TAG_DATE=$(gh api "repos/canboat/canboat/commits/$TAG" --jq .commit.committer.date)
            CUR_DATE=$(gh api "repos/canboat/canboat/commits/$CURRENT" --jq .commit.committer.date 2>/dev/null || echo "")
            if [ -n "$CUR_DATE" ] && [ ! "$TAG_DATE" \> "$CUR_DATE" ]; then
              echo "Release $TAG ($TAG_DATE) is not newer than the pinned $CURRENT ($CUR_DATE)"
              echo "skip=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          fi
          echo "skip=false" >> "$GITHUB_OUTPUT"

      - name: Move the pin
        if: steps.target.outputs.skip == 'false'
        run: |
          set -euo pipefail
          VERSION="${{ steps.target.outputs.version }}"
          # The dispatch comes after the crate is published, but a
          # scheduled run can land between canboat's tag and its crates.io
          # publish: wait for the crate (up to 30 min) rather than fail.
          for _ in $(seq 1 30); do
            if curl -sSf -A "canboat-wasm track-canboat (github.com/canboat/canboat-wasm)" \
                 "https://crates.io/api/v1/crates/canboat/$VERSION" -o /dev/null; then
              break
            fi
            echo "canboat $VERSION is not on crates.io yet; waiting"
            sleep 60
          done
          sed -i -E "s%^(canboat *= *\{ *version = \")=?[^\"]+\"%\1=$VERSION\"%" Cargo.toml
          grep -qE "^canboat *= *\{ *version = \"=$VERSION\"" Cargo.toml
          cargo update -p canboat

      - name: Install Rust with wasm target
        if: steps.target.outputs.skip == 'false'
        run: rustup target add wasm32-unknown-unknown

      - name: Install wasm-pack
        if: steps.target.outputs.skip == 'false'
        run: npm install -g wasm-pack

      - name: Build, typecheck and test against the new brain
        if: steps.target.outputs.skip == 'false'
        run: |
          npm install
          npm run build
          npm run typecheck
          npm test

      - name: Open the tracking PR
        if: steps.target.outputs.skip == 'false'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          TAG: ${{ steps.target.outputs.tag }}
          VERSION: ${{ steps.target.outputs.version }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "track-canboat-$TAG"
          git add Cargo.toml Cargo.lock
          git commit -m "feat: canboat $TAG" -m "Release-As: $VERSION"
          git push origin "track-canboat-$TAG"
          gh pr create \
            --title "feat: canboat $TAG" \
            --body "$(printf 'Moves the brain pin to [canboat %s](https://github.com/canboat/canboat/releases/tag/%s). Build, typecheck and both smoke suites passed against the new pin in the [tracking run](%s).\n\nMerging this makes release-please propose **chore: release %s**; merging that tags and publishes `@canboat/wasm@%s` to npm.\n\n⚠️ If squash-merging, keep the footer below in the squash commit message — it is what pins the release version.\n\nRelease-As: %s' "$TAG" "$TAG" "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" "$VERSION" "$VERSION" "$VERSION")"

          # Arm auto-merge on the PR just created, so a canboat release
          # reaches npm without a human step. The release-please PR that
          # follows arms its own auto-merge, completing the chain.
          #
          # Scoped to this branch alone -- only the tracking PR this step
          # just pushed. Ordinary PRs (dependabot, features, fixes) are
          # untouched and still merge by hand.
          #
          # Branch protection requires build-and-test, so GitHub holds the
          # merge until CI is green. A merge commit, not squash, keeps the
          # Release-As footer that pins the release version.
          gh pr merge "track-canboat-$TAG" --merge --auto

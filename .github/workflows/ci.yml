name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: ${{ github.ref_name != 'main' }}

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust with wasm target
        run: rustup target add wasm32-unknown-unknown

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-${{ runner.os }}-${{ hashFiles('Cargo.toml') }}

      - name: Native unit tests
        run: cargo test

      - name: Rustfmt
        run: cargo fmt --check

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Install wasm-pack
        run: npm install -g wasm-pack

      - name: Build wasm
        run: npm run build:wasm

      - name: Report size
        run: |
          ls -la pkg/
          gzip -c pkg/canboat_wasm_bg.wasm | wc -c \
            | awk '{printf "wasm gzipped: %.0f KB\n", $1/1024}'

      - name: Install JS dependencies
        run: npm install

      - name: Lint and format check (read-only)
        run: npm run ci-lint

      - name: Typecheck (strict)
        run: npm run typecheck

      - name: Build dual ESM/CJS output
        run: npm run build:ts

      - name: Smoke tests (ESM + CJS entries)
        run: npm test

      # wasm-pack writes pkg/.gitignore ('*'), and npm honors nested
      # ignore files even inside files:-listed directories — without the
      # rm in build:wasm the published tarball ships no .wasm at all.
      - name: Tarball must contain the wasm and both builds
        run: |
          npm pack --dry-run 2>&1 | tee pack.txt
          grep -q "pkg/canboat_wasm_bg.wasm" pack.txt
          grep -q "dist/index.cjs" pack.txt
          grep -q "dist/index.js" pack.txt

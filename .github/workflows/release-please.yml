name: release-please

# Same release machinery as canboat itself: release-please maintains a
# release PR from conventional commits; merging it tags vX.Y.Z and cuts
# the GitHub Release, and the tag triggers publish.yml (npm via OIDC).
# Version steering follows canboat's convention — a commit with a
# `Release-As: X.Y.Z` footer (the track-canboat workflow writes one for
# every canboat release) pins the next version exactly, so this package
# always releases under the canboat version whose brain it compiles.

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      pr: ${{ steps.rp.outputs.pr }}
    steps:
      - uses: actions/create-github-app-token@v3
        id: app-token
        with:
          app-id: ${{ secrets.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}

      - uses: googleapis/release-please-action@v5
        id: rp
        with:
          # A GitHub App token, never GITHUB_TOKEN. Two reasons: a tag
          # pushed with GITHUB_TOKEN does not trigger publish.yml (so
          # releases would never reach npm), and CI does not run on a PR
          # opened by it. An App installation token has no expiry date to
          # forget, unlike a PAT.
          token: ${{ steps.app-token.outputs.token }}

  # release-please bumps package.json and (via the x-release-please-version
  # annotation) the crate version in Cargo.toml, but Cargo.lock records a
  # version for the workspace member too — a bumped Cargo.toml with a stale
  # Cargo.lock breaks `cargo --locked` builds on the release PR, so re-stamp
  # it on the release branch. --workspace touches only the member package;
  # third-party pins stay exactly as locked.
  regenerate:
    needs: release-please
    if: ${{ needs.release-please.outputs.pr != '' && needs.release-please.outputs.pr != 'null' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/create-github-app-token@v3
        id: app-token
        with:
          app-id: ${{ secrets.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}

      - uses: actions/checkout@v7
        with:
          ref: ${{ fromJson(needs.release-please.outputs.pr).headBranchName }}
          # Pushing the re-stamped lockfile with GITHUB_TOKEN would also
          # skip CI on the release PR.
          token: ${{ steps.app-token.outputs.token }}

      - name: re-stamp Cargo.lock
        run: cargo update --workspace

      - name: commit re-stamped lockfile
        run: |
          if ! git diff --exit-code; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -am "chore: re-stamp Cargo.lock for release"
            git push
          fi

  # Without this the chain stalls: release-please proposes the release PR
  # and publish.yml is armed on the tag, but nothing merges the PR, so a
  # release waits on someone noticing. 8.0.0 sat ready for two days that
  # way. Auto-merge closes the gap while keeping CI as the gate — GitHub
  # holds the merge until required checks pass and merges only then, so
  # this is "merge when green", not "merge now". That guarantee comes from
  # branch protection requiring the build-and-test check; without a
  # required check auto-merge would land the PR immediately.
  #
  # Runs after regenerate so the re-stamped Cargo.lock is already on the
  # branch; enabling auto-merge before that push would race it.
  #
  # Only ever touches release-please's own PRs. A merge commit (not
  # squash) is what release-please expects to recognise its release.
  auto-merge:
    needs: [release-please, regenerate]
    if: ${{ needs.release-please.outputs.pr != '' && needs.release-please.outputs.pr != 'null' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/create-github-app-token@v3
        id: app-token
        with:
          app-id: ${{ secrets.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}

      - name: enable auto-merge on the release PR
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          PR: ${{ fromJson(needs.release-please.outputs.pr).number }}
        run: |
          set -euo pipefail
          gh pr merge "$PR" --repo "$GITHUB_REPOSITORY" --merge --auto
          echo "auto-merge armed on #$PR; it lands when required checks pass"
